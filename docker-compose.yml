services:
  postgres:
    image: postgres:16-alpine
    container_name: idea-factory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idea_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idea_factory_password}
      POSTGRES_DB: ${POSTGRES_DB:-idea_factory}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - idea_factory_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idea_factory} -d ${POSTGRES_DB:-idea_factory}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  idea_factory_pgdata:
    name: idea_factory_pgdata

